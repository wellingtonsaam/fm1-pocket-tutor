function render() {

// ------------------------------------------------------------ ações ---
const PRODUCT_MODEL = P ? P.product.split("_")[0] : "FM-1";
async function acesso() {
  if (S.midi) return S.midi;
  try { S.midi = await navigator.requestMIDIAccess({ sysex: true }); S.nav = "ok"; }
  catch (_) { S.nav = "denied"; throw Object.assign(new Error("denied"), { code: "denied" }); }
  S.midi.onstatechange = () => { if (S.tela === "conferir" && !presente()) { S.tela = "conectar"; S.dev = null; S.con = "off"; S.conTxt = ""; S.msg = T("FM-1 desconectado"); render(); } };
  return S.midi;
}
function presente() {
  const live = (m) => { const a = []; m.forEach((p) => { if (p.state !== "disconnected") a.push(p); }); return a; };
  return live(S.midi.inputs).some((p) => window.FM1Ports.LOOKS.test(p.name || ""));
}
// o que está no FM-1 agora: { identity, ota, version } ou null
async function ler() {
  const d = await I.inspectDevice(await acesso(), { log: false });
  if (!d.identity) return null;
  return { identity: d.identity, ota: d.ota, model: d.model, version: d.dock && d.dock.version ? d.dock.version : null };
}
function mostra(dev) {
  S.dev = dev;
  if (!dev) { S.con = "off"; S.conTxt = ""; return; }
  S.con = dev.ota ? "upd" : "on";
  S.conTxt = dev.ota ? `${T("Modo de atualização")} · ${dev.identity}` : `${T("Conectado")} · ${dev.identity}`;
}
async function conectar() {
  S.busy = true; S.msg = null; render();
  try {
    const dev = await ler();
    if (!dev) throw Object.assign(new Error("notfound"), { code: "notfound" });
    if (!window.FM1Ota.sameKeyboard(dev.model, PRODUCT_MODEL)) throw Object.assign(new Error("model"), { code: "model" });
    mostra(dev); log("conectado: " + dev.identity + (dev.version ? " " + dev.version : ""));
    S.conf = false; S.tela = dev.ota ? "retomar" : "conferir";
  } catch (e) {
    S.msg = say(e.code, e.code === "inuse" ? e.detail || "" : ""); log("conectar: " + (e.code || "") + " " + e.message);
  }
  S.busy = false; render();
}
function passo(k, v) {
  if (k !== "verify" && k !== "write") log(k + (v != null ? " " + v : ""));
  const n = Math.max(1, Math.ceil(S.imgLen / 512));
  if (k === "start") { S.et = ["now", "wait", "wait", "wait", "wait"]; S.con = "on"; S.conTxt = `${T("Conectado")} · ${v}`; }
  else if (k === "loader") { S.et[0] = "done"; S.et[1] = "now"; S.con = "upd"; S.conTxt = T("Modo de atualização"); }
  else if (k === "write") { S.et[0] = S.et[1] = "done"; S.et[2] = "now"; S.pct = Math.min(99, Math.floor(v * 100 / n)); S.con = "upd"; S.conTxt = `${T("Modo de atualização")} · ota-${P.product}`; }
  else if (k === "reboot") { S.et[0] = S.et[1] = S.et[2] = "done"; S.et[3] = "now"; S.pct = 100; S.con = "upd"; S.conTxt = T("Reiniciando"); }
  else if (k === "done") { S.et[3] = "done"; S.et[4] = "now"; S.con = "on"; S.conTxt = `${T("Conectado")} · ${v}`; }
  render();
}
const segura = (e) => { e.preventDefault(); e.returnValue = ""; return ""; };
async function gravar() {
  if (!S.conf && S.tela !== "erro") return;     // nada é gravado sem a caixa marcada (regra do projeto)
  const retomando = !!(S.dev && S.dev.ota);
  S.tela = "gravando"; S.err = null; S.pct = 0;
  S.et = retomando ? ["done", "done", "now", "wait", "wait"] : ["now", "wait", "wait", "wait", "wait"];
  addEventListener("beforeunload", segura); render();
  try {
    const pkg = await I.checkPackage(PCK, P);
    S.imgLen = pkg.image.length;
    log("pacote ok: " + pkg.product + " " + P.version + " sha256 " + P.sha256.slice(0, 12));
    const got = await I.installOn(await acesso(), pkg, P.name, async () => true, passo);
    if (!got) throw Object.assign(new Error("the FM-1 was not found to finish the install"), { code: "stopped" });
    S.et = ["done", "done", "done", "done", "now"]; S.pct = 100; render();
    let dev = null;
    for (let t = 0; t < 3 && !(dev && dev.version); t++) { try { dev = await ler(); } catch (_) {} if (!(dev && dev.version)) await new Promise((r) => setTimeout(r, 800)); }
    mostra(dev || { identity: got, ota: false, version: null });
    S.verFinal = dev && dev.version; log("conferido: " + got + (S.verFinal ? " " + S.verFinal : " (sem versão)"));
    S.et[4] = "done"; S.tela = "pronto";
  } catch (e) {
    const i = S.et.indexOf("now");
    if (i >= 0) S.et[i] = "bad"; else S.et[2] = "bad";
    S.err = { code: e.code || "erro", text: say(e.code, e.code === "mismatch" || e.code === "inuse" ? e.detail || "" : ["badpkg", "badreq"].includes(e.code) || !DICT.pt[e.code] ? e.message : "") };
    log("erro " + S.err.code + ": " + e.message);
    S.tela = "erro"; S.con = ["lost", "noloader", "noreturn"].includes(e.code) ? "bad" : S.con;
    if (S.con === "bad") S.conTxt = T("Desconectado");
  } finally { removeEventListener("beforeunload", segura); render(); }
}
// TENTAR DE NOVO: lê o FM-1 primeiro. Em modo de atualização: termina a gravação. Já com esta versão: pronto. Sem
// versão para comparar: volta a CONFERIR (a pessoa confirma de novo). Senão grava de novo (ela já confirmou).
async function tentar() {
  S.busy = true; render();
  let dev = null;
  try { dev = await ler(); } catch (e) { log("tentar: " + (e.code || "") + " " + e.message); }
  S.busy = false;
  if (!dev) { S.err = { code: "notfound", text: say("notfound") }; render(); return; }
  mostra(dev);
  if (dev.ota) return gravar();
  if (dev.identity === P.product && dev.version && dev.version === P.version) { S.verFinal = dev.version; S.et = ["done", "done", "done", "done", "done"]; S.tela = "pronto"; render(); return; }
  if (!dev.version) { S.conf = false; S.tela = "conferir"; render(); return; }
  return gravar();
}
function voltar() {
  if (S.tela === "gravando") return;
  // veio do botão do app (?de=app): volta para ele, onde estava; senão abre o app
  if (new URLSearchParams(location.search).get("de") === "app" && history.length > 1) history.back();
  else location.href = "prototipo-aulas.html";
}
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "conectar") conectar();
  else if (a === "gravar") gravar();
  else if (a === "tentar") tentar();
  else if (a === "voltar") voltar();
  else if (a === "copiar") {
    const txt = [`FM1 Pocket Tutor · ${P && P.product} ${P && P.version} · ${navigator.userAgent}`, ...S.log].join("\n");
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { b.textContent = T("Copiado"); }, () => {});
  } else if (a === "tema") {
    const c = cfg(); c.theme = document.documentElement.dataset.theme === "escuro" ? "claro" : "escuro";
    try { localStorage.setItem("fm1s", JSON.stringify(c)); } catch (_) {}
    tema();
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "conf") { S.conf = ev.target.checked; render(); }
  else if (ev.target.id === "lang") { LANG = ev.target.value; try { localStorage.setItem("fm1lang", LANG); } catch (_) {} render(); }
});
tema(); render();
</script>
